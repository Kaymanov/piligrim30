цедуры судебного банкротства.</p><h2 id=\"article-1\">Судебное и внесудебное банкротство</h2><p>Гражданин может быть признан банкротом по решению арбитражного суда или во внесудебном порядке бесплатно через МФЦ. Выбор процедуры зависит от обстоятельств конкретной ситуации.</p><h2 id=\"article-2\">С чего начинается работа</h2><p>На консультации проводим анализ вашей ситуации. После заключения договора юридическое сопровождение включает сбор документов и дальнейшую работу по делу.</p><div class=\"notice gap\"><b>Важно знать</b><p>При прохождении процедуры судебного банкротства физических лиц арбитражным судом может быть введена процедура реструктуризации долгов гражданина либо реализация имущества. Процедура банкротства имеет юридические последствия, перечисленные в ст. 213.11, 213.30 ФЗ «О несостоятельности (банкротстве)» от 26.10.2002 № 127-ФЗ. Гражданин может быть освобождён от уплаты не всех долгов.</p></div><h2 id=\"article-3\">Обсудите вашу ситуацию с юристом</h2><p>Бесплатная консультация при сумме долга от 300 000 ₽. Консультация по вопросам, не связанным с банкротством граждан, — 1 000 ₽ за час.</p><div class=\"actions\"><a href=\"#consultation\" data-page=\"consultation\" class=\"btn \">Получить консультацию</a></div></article><aside class=\"aside\"><h3>В этом материале</h3><a href=\"#article-1\">Судебная процедура и МФЦ</a><a href=\"#article-2\">Начало работы</a><a href=\"#article-3\">Консультация</a><hr style=\"border:0;border-top:1px solid var(--line);margin:25px 0\"><h3>Есть вопрос?</h3><p>Задайте общий вопрос ИИ-помощнику или запишитесь к юристу.</p><a href=\"#ai\" data-page=\"ai\" class=\"btn \">Открыть ИИ-юриста</a></aside></div></section>", "cases": "<div class=\"wrap\"><div class=\"crumb\"><a href=\"#home\" data-page=\"home\" class=\"\">Главная</a> / Кейсы</div><section class=\"pagehead\"><div class=\"eyebrow\">Практика</div><h1>Кейсы</h1><p>Истории дел: ситуация, работа юриста и результат.</p></section></div><div class=\"wrap\"><div class=\"demo-band\"><b>Демонстрационные материалы.</b> Примеры пока не являются реальными результатами работы кабинета. Позже заменим их подтверждёнными делами.</div><div class=\"chips\"><span class=\"chip active\">Все примеры</span><span class=\"chip\">Судебное банкротство</span><span class=\"chip\">Через МФЦ</span></div><div class=\"grid three\"><div class=\"card case-card\"><span class=\"label demo\">Демонстрационный кейс</span><div class=\"bignum\">1 840 000 ₽</div><p class=\"smalltext\">Пример суммы обязательств</p><h3 class=\"gap\">Кредиты и микрозаймы</h3><p>Вариант карточки судебного банкротства</p><ul><li>Ситуация и задача клиента</li><li>Этапы юридической работы</li><li>Результат и документы</li></ul><a href=\"#case\" data-page=\"case\" class=\"link\">Посмотреть пример →</a></div><div class=\"card case-card\"><span class=\"label demo\">Демонстрационный кейс</span><div class=\"bignum\">960 000 ₽</div><p class=\"smalltext\">Пример суммы обязательств</p><h3 class=\"gap\">Потребительские кредиты</h3><p>Вариант карточки с несколькими кредиторами</p><ul><li>Ситуация и задача клиента</li><li>Этапы юридической работы</li><li>Результат и документы</li></ul><a href=\"#case\" data-page=\"case\" class=\"link\">Посмотреть пример →</a></div><div class=\"card case-card\"><span class=\"label demo\">Демонстрационный кейс</span><div class=\"bignum\">412 000 ₽</div><p class=\"smalltext\">Пример суммы обязательств</p><h3 class=\"gap\">Микрозаймы и ЖКХ</h3><p>Вариант внесудебной процедуры</p><ul><li>Ситуация и задача клиента</li><li>Этапы юридической работы</li><li>Результат и документы</li></ul><a href=\"#case\" data-page=\"case\" class=\"link\">Посмотреть пример →</a></div></div></div><section class=\"softbg gap\"><div class=\"wrap grid two\"><div><h2>В каждом деле — своя ситуация</h2><p class=\"muted gap\">Размер задолженности сам по себе не определяет результат. На консультации необходимо обсудить доходы, имущество и обстоятельства возникновения долгов.</p></div><div class=\"notice gap\" ta\"><div><h2>Разберём вашу ситуацию на консультации</h2><p>Бесплатная консультация при сумме долга от 300 000 ₽. По иным юридическим вопросам — 1 000 ₽ за час.</p></div><a href=\"#consultation\" data-page=\"consultation\" class=\"btn \">Записаться</a></div></div></section>", "privacy": "<div class=\"wrap\"><div class=\"crumb\"><a href=\"#home\" data-page=\"home\" class=\"\">Главная</a> / Политика обработки персональных данных</div><section class=\"pagehead\"><div class=\"eyebrow\">Документы</div><h1>Политика обработки персональных данных</h1></section></div><section style=\"padding-top:0\"><div class=\"wrap\"><article class=\"doc\"><div class=\"docnote\">Макет оформления документа. Текст перенесён из репозитория, email обновлён по указанию владельца. Перед публикацией — сверка юридической редакции.</div> <h2>1. Общие положения</h2> <p> Настоящая политика обработки персональных данных составлена в соответствии с требованиями Федерального закона от 27.07.2006. № 152-ФЗ «О персональных данных» (далее — Закон о персональных данных) и определяет порядок обработки персональных данных и меры по обеспечению безопасности персональных данных, предпринимаемые ИП Бурлуцким Олегом Алексеевичем (далее — Оператор). </p> <p> 1.1. Оператор ставит своей важнейшей целью и условием осуществления своей деятельности соблюдение прав и свобод человека и гражданина при обработке его персональных данных, в том числе защиты прав на неприкосновенность частной жизни, личную и семейную тайну. </p> <p> 1.2. Настоящая политика Оператора в отношении обработки персональных данных (далее — Политика) применяется ко всей информации, которую Оператор может получить о посетителях веб-сайта https://piligrim30.ru. </p> <h2>2. Основные понятия, используемые в Политике</h2> <p> 2.1. <strong>Автоматизированная обработка персональных данных</strong> — обработка персональных данных с помощью средств вычислительной техники. </p> <p> 2.2. <strong>Блокирование персональных данных</strong> — временное прекращение обработки персональных данных (за исключением случаев, если обработка необходима для уточнения персональных данных). </p> <p> 2.3. <strong>Веб-сайт</strong> — совокупность графических и информационных материалов, а также программ для ЭВМ и баз данных, обеспечивающих их доступность в сети интернет по сетевому адресу https://piligrim30.ru. </p> <p> 2.4. <strong>Информационная система персональных данных</strong> — совокупность содержащихся в базах данных персональных данных и обеспечивающих их обработку информационных технологий и технических средств. </p> <p> 2.5. <strong>Обезличивание персональных данных</strong> — действия, в результате которых невозможно определить без использования дополнительной информации принадлежность персональных данных конкретному Пользователю или иному субъекту персональных данных. </p> <p> 2.6. <strong>Обработка персональных данных</strong> — любое действие (операция) или совокупность действий (операций), совершаемых с использованием средств автоматизации или без использования таких средств с персональными данными, включая сбор, запись, систематизацию, накопление, хранение, уточнение (обновление, изменение), извлечение, использование, передачу (распространение, предоставление, доступ), обезличивание, блокирование, удаление, уничтожение персональных данных. </p> <p> 2.7. <strong>Оператор</strong> — государственный орган, муниципальный орган, юридическое или физическое лицо, самостоятельно или совместно с другими лицами организующие и/или осуществляющие обработку персональных данных, а также определяющие цели обработки персональных данных, состав персональных данных, подлежащих обработке, действия (операции), совершаемые с персональными данными. </p> <p> 2.8. <strong>Персональные данные</strong> — любая информация, относящаяся прямо или косвенно к определенному или определяемому Пользователю веб-сайта https://piligrim30.ru. </p> <p> 2.9. <strong> Персональные данные, разрешенные субъектом персональных данных для распространения </strong> — персональные данные, доступ неограниченного круга лиц к которым предоставлен субъектом персональных данных путем дачи согласия на обработку персональных данных, разрешенных субъектом персональных данных для распространения в порядке, предусмотренном Законом о персональных данных. </p> <p> 2.10. <strong>Пользователь</strong> — любой посетитель веб-сайта https://piligrim30.ru. </p> <p> 2.11. <strong>Предоставление персональных данных</strong> — действия, направленные на раскрытие персональных данных определенному лицу или определенному кругу лиц. </p> <p> 2.12. <strong>Распространение персональных данных</strong> — любые действия, направленные на раскрытие персональных данных неопределенному кругу лиц (передача персональных данных) или на ознакомление с персональными данными неограниченного круга лиц, в том числе обнародование персональных данных в средствах массовой информации, размещение в информационно-телекоммуникационных сетях или предоставление доступа к персональным данным каким-либо иным способом. </p> <p> 2.13. <strong>Трансграничная передача персональных данных</strong> — передача персональных данных на территорию иностранного государства органу власти иностранного государства, иностранному физическому или иностранному юридическому лицу. </p> <p> 2.14. <strong>Уничтожение персональных данных</strong> — любые действия, в результате которых персональные данные уничтожаются безвозвратно с невозможностью дальнейшего восстановления содержания персональных данных в информационной системе персональных данных и/или уничтожаются материальные носители персональных данных. </p> <h2>3. Основные права и обязанности Оператора</h2> <p>3.1. Оператор имеет право:</p> <ul> <li> получать от субъекта персональных данных достоверные информацию и/или документы, содержащие персональные данные; </li> <li> в случае отзыва субъектом персональных данных согласия на обработку персональных данных, а также, направления обращения с требованием о прекращении обработки персональных данных, Оператор вправе продолжить обработку персональных данных без согласия субъекта персональных данных при наличии оснований, указанных в Законе о персональных данных; </li> <li> самостоятельно определять состав и перечень мер, необходимых и достаточных для обеспечения выполнения обязанностей, предусмотренных Законом о персональных данных и принятыми в соответствии с ним нормативными правовыми актами, если иное не предусмотрено Законом о персональных данных или другими федеральными законами. </li> </ul> <p>3.2. Оператор обязан:</p> <ul> <li> предоставлять субъекту персональных данных по его просьбе информацию, касающуюся обработки его персональных данных; </li> <li> организовывать обработку персональных данных в порядке, установленном действующим законодательством РФ; </li> <li> отвечать на обращения и запросы субъектов персональных данных и их законных представителей в соответствии с требованиями Закона о персональных данных; </li> <li> сообщать в уполномоченный орган по защите прав субъектов персональных данных по запросу этого органа необходимую информацию в течение 10 дней с даты получения такого запроса; </li> <li> публиковать или иным образом обеспечивать неограниченный доступ к настоящей Политике в отношении обработки персональных данных; </li> <li> принимать правовые, организационные и технические меры для защиты персональных данных от неправомерного или случайного доступа к ним, уничтожения, изменения, блокирования, копирования, предоставления, распространения персональных данных, а также от иных неправомерных действий в отношении персональных данных; </li> <li> прекратить передачу (распространение, предоставление, доступ) персональных данных, прекратить обработку и уничтожить персональные данные в порядке и случаях, предусмотренных Законом о персональных данных; </li> <li> исполнять иные обязанности, предусмотренные Законом о персональных данных. </li> </ul> <h2>4. Основные права и обязанности субъектов персональных данных</h2> <p>4.1. Субъекты персональных данных имеют право:</p> <ul> <li> получать информацию, касающуюся обработки его персональных данных, за исключением случаев, предусмотренных федеральными законами; </li> <li> требовать от оператора уточнения его персональных данных, их блокирования или уничтожения в случае, если персональные данные являются неполными, устаревшими, неточными, незаконно полученными или не являются необходимыми для заявленной цели обработки; </li> <li> выдвигать условие предварительного согласия при обработке персональных данных в целях продвижения на рынке товаров, работ и услуг; </li> <li> на отзыв согласия на обработку персональных данных, а также, на направление требования о прекращении обработки персональных данных; </li> <li> обжаловать в уполномоченный орган по защите прав субъектов персональных данных или в судебном порядке неправомерные действия или бездействие Оператора при обработке его персональных данных; </li> <li> на осуществление иных прав, предусмотренных законодательством РФ. </li> </ul> <p>4.2. Субъекты персональных данных обязаны:</p> <ul> <li>предоставлять Оператору достоверные данные о себе;</li> <li> сообщать Оператору об уточнении (обновлении, изменении) своих персональных данных. </li> </ul> <p> 4.3. Лица, передавшие Оператору недостоверные сведения о себе, либо сведения о другом субъекте персональных данных без согласия последнего, несут ответственность в соответствии с законодательством РФ. </p> <h2>5. Принципы обработки персональных данных</h2> <p> 5.1. Обработка персональных данных осуществляется на законной и справедливой основе. </p> <p> 5.2. Обработка персональных данных ограничивается достижением конкретных, заранее определенных и законных целей. </p> <p> 5.3. Не допускается объединение баз данных, содержащих персональные данные, обработка которых осуществляется в целях, несовместимых между собой. </p> <p> 5.4. Обработке подлежат только персональные данные, которые отвечают целям их обработки. </p> <p> 5.5. Содержание и объем обрабатываемых персональных данных соответствуют заявленным целям обработки. </p> <p> 5.6. При обработке персональных данных обеспечивается точность персональных данных, их достаточность, а в необходимых случаях и актуальность по отношению к целям обработки персональных данных. </p> <p> 5.7. Хранение персональных данных осуществляется в форме, позволяющей определить субъекта персональных данных, не дольше, чем этого требуют цели обработки персональных данных. </p> <h2>6. Цели обработки персональных данных</h2> <p> <strong>Цель обработки:</strong> заключение, исполнение и прекращение гражданско-правовых договоров. </p> <p> <strong>Персональные данные:</strong> </p> <ul> <li>фамилия, имя, отчество</li> <li>электронный адрес</li> <li>номера телефонов</li> <li>год, месяц, дата и место рождения</li> </ul> <p> <strong>Правовые основания:</strong> договоры, заключаемые между оператором и субъектом персональных данных. </p> <p> <strong>Виды обработки персональных данных:</strong> </p> <ul> <li> Сбор, запись, систематизация, накопление, хранение, уничтожение и обезличивание персональных данных </li> <li>Отправка информационных писем на адрес электронной почты</li> </ul> <h2>7. Условия обработки персональных данных</h2> <p> 7.1. Обработка персональных данных осуществляется с согласия субъекта персональных данных на обработку его персональных данных. </p> <p> 7.2. Обработка персональных данных необходима для достижения целей, предусмотренных международным договором Российской Федерации или законом. </p> <p> 7.3. Обработка персональных данных необходима для осуществления правосудия, исполнения судебного акта. </p> <p> 7.4. Обработка персональных данных необходима для исполнения договора, стороной которого является субъект персональных данных. </p> <p> 7.5. Обработка персональных данных необходима для осуществления прав и законных интересов оператора или третьих лиц. </p> <p> 7.6. Осуществляется обработка персональных данных, доступ неограниченного круга лиц к которым предоставлен субъектом персональных данных. </p> <p> 7.7. Осуществляется обработка персональных данных, подлежащих опубликованию или обязательному раскрытию в соответствии с федеральным законом. </p> <h2> 8. Порядок сбора, хранения, передачи и других видов обработки персональных данных </h2> <p> Безопасность персональных данных, которые обрабатываются Оператором, обеспечивается путем реализации правовых, организационных и технических мер, необходимых для выполнения в полном объеме требований действующего законодательства в области защиты персональных данных. </p> <p> 8.1. Оператор обеспечивает сохранность персональных данных и принимает все возможные меры, исключающие доступ к персональным данным неуполномоченных лиц. </p> <p> 8.2. Персональные данные Пользователя никогда, ни при каких условиях не будут переданы третьим лицам, за исключением случаев, связанных с исполнением действующего законодательства. </p> <p> 8.3. В случае выявления неточностей в персональных данных, Пользователь может актуализировать их самостоятельно, путем направления Оператору уведомление на адрес электронной почты Оператора bfl-30rus@yandex.ru с пометкой «Актуализация персональных данных». </p> <p> 8.4. Срок обработки персональных данных определяется достижением целей, для которых были собраны персональные данные. Пользователь может в любой момент отозвать свое согласие на обработку персональных данных, направив Оператору уведомление посредством электронной почты на электронный адрес Оператора bfl-30rus@yandex.ru с пометкой «Отзыв согласия на обработку персональных данных». </p> <p> 8.5. Вся информация, которая собирается сторонними сервисами, хранится и обрабатывается указанными лицами в соответствии с их Пользовательским соглашением и Политикой конфиденциальности. </p> <p> 8.6. Установленные субъектом персональных данных запреты на передачу не действуют в случаях обработки персональных данных в государственных, общественных и иных публичных интересах, определенных законодательством РФ. </p> <p> 8.7. Оператор при обработке перс
