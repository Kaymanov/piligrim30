# Merge these locations into the existing HTTPS server {}.
# Keep existing certificates, media/static aliases and ACME configuration.
# Install the companion files in /etc/nginx/piligrim/ before including this file.
client_header_timeout 10s;
client_body_timeout 15s;
send_timeout 30s;
client_max_body_size 10m;
limit_req_status 429;
limit_conn_status 429;
limit_req_log_level warn;

location ~ ^/api/v1/leads(?:/|\.|$) {
    client_max_body_size 16k;
    limit_req zone=piligrim_leads burst=5 nodelay;
    limit_req zone=piligrim_total_requests burst=60 nodelay;
    include /etc/nginx/piligrim/proxy-headers.conf;
    proxy_pass http://127.0.0.1:8001;
}

location ~ ^/api/v1/chat(?:/|$) {
    client_max_body_size 16k;
    limit_req zone=piligrim_chat burst=5 nodelay;
    limit_req zone=piligrim_total_requests burst=60 nodelay;
    limit_conn piligrim_connections 1;
    limit_conn piligrim_total_connections 6;
    proxy_buffering off;
    proxy_cache off;
    include /etc/nginx/piligrim/proxy-headers.conf;
    proxy_pass http://127.0.0.1:8001;
}

location = /api/v1/csrf/ {
    limit_req zone=piligrim_csrf burst=10 nodelay;
    limit_req zone=piligrim_total_requests burst=60 nodelay;
    proxy_cache off;
    include /etc/nginx/piligrim/proxy-headers.conf;
    proxy_pass http://127.0.0.1:8001;
}

location ~ ^/admin/login/?$ {
    client_max_body_size 16k;
    limit_req zone=piligrim_login burst=5 nodelay;
    limit_req zone=piligrim_total_requests burst=60 nodelay;
    proxy_cache off;
    include /etc/nginx/piligrim/proxy-headers.conf;
    proxy_pass http://127.0.0.1:8001;
}

location /api/ {
    limit_req zone=piligrim_pages burst=40 nodelay;
    limit_req zone=piligrim_total_requests burst=60 nodelay;
    include /etc/nginx/piligrim/proxy-headers.conf;
    proxy_pass http://127.0.0.1:8001;
}

location /admin/ {
    limit_req zone=piligrim_pages burst=40 nodelay;
    limit_req zone=piligrim_total_requests burst=60 nodelay;
    proxy_cache off;
    include /etc/nginx/piligrim/proxy-headers.conf;
    proxy_pass http://127.0.0.1:8001;
}

location /ckeditor5/ {
    limit_req zone=piligrim_pages burst=10 nodelay;
    limit_req zone=piligrim_total_requests burst=60 nodelay;
    include /etc/nginx/piligrim/proxy-headers.conf;
    proxy_pass http://127.0.0.1:8001;
}

location ~ /\.(?!well-known/) {
    return 404;
}

location / {
    limit_req zone=piligrim_pages burst=40 nodelay;
    limit_req zone=piligrim_total_requests burst=60 nodelay;
    include /etc/nginx/piligrim/proxy-headers.conf;
    proxy_pass http://127.0.0.1:3000;
}
