# Configuration for the inspected deployment on 194.113.35.110.
server {
    listen 80;
    server_name test.piligrim30.ru;
    return 301 https://$host$request_uri;
}

server {
    # Keep the original listener for rollback of the Xray route.
    listen 127.0.0.1:446 ssl;
    listen 127.0.0.1:8446 ssl proxy_protocol;
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;
    server_name test.piligrim30.ru;

    ssl_certificate /etc/letsencrypt/live/test.piligrim30.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.piligrim30.ru/privkey.pem;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    if (-f /opt/piligrim30/.maintenance) { return 503; }

    location /_next/static/ {
        include /etc/nginx/piligrim/proxy-headers.conf;
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /static/ {
        include /etc/nginx/piligrim/proxy-headers.conf;
        proxy_pass http://127.0.0.1:8001;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
    location /media/ {
        alias /opt/piligrim30/backend/media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    include /etc/nginx/piligrim/security-locations.conf;
}
