# Include once inside nginx's http {}. Merge with existing config; do not replace it.
limit_req_zone $binary_remote_addr zone=piligrim_pages:10m rate=10r/s;
limit_req_zone $server_name zone=piligrim_total_requests:1m rate=60r/s;
limit_req_zone $binary_remote_addr zone=piligrim_leads:10m rate=3r/m;
limit_req_zone $binary_remote_addr zone=piligrim_chat:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=piligrim_csrf:10m rate=12r/m;
map $request_method $piligrim_login_key {
    default "";
    POST $binary_remote_addr;
}
limit_req_zone $piligrim_login_key zone=piligrim_login:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=piligrim_connections:10m;
limit_conn_zone $server_name zone=piligrim_total_connections:1m;
