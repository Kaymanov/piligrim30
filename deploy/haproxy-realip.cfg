# Optional relay for the existing Xray/Reality topology on 194.113.35.110.
# Do not enable until Nginx :8446 accepts PROXY protocol and Xray has xver=2.
# Other SNI routes retain their current destinations and ordinary TCP format.
global
    maxconn 2048

defaults
    mode tcp
    timeout connect 5s
    timeout client 1h
    timeout server 1h

frontend reality_fallback
    bind 127.0.0.1:1444 accept-proxy
    tcp-request inspect-delay 5s
    tcp-request content accept if { req.ssl_hello_type 1 }
    use_backend piligrim if { req.ssl_sni -i test.piligrim30.ru }
    use_backend amsterdam if { req.ssl_sni -i stats.vk-portal.net }
    default_backend panel

backend piligrim
    server nginx 127.0.0.1:8446 send-proxy-v2

backend amsterdam
    server existing 185.159.130.82:443

backend panel
    server existing 127.0.0.1:445
