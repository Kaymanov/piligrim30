services:
  postgres:
    image: postgres:15-alpine
    container_name: piligrim_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-piligrim_db}
      POSTGRES_USER: ${POSTGRES_USER:-piligrim_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-piligrim_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-piligrim_user} -d ${POSTGRES_DB:-piligrim_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - piligrim_network

  redis:
    image: redis:7-alpine
    container_name: piligrim_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - piligrim_network

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: piligrim_backend
    restart: unless-stopped
    command: /app/docker/backend/entrypoint.sh
    volumes:
      - ./backend:/app/backend
      - /app/backend/.venv
      - ./docker:/app/docker
    env_file:
      - .env
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - piligrim_network

  celery_worker:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: piligrim_celery
    restart: unless-stopped
    command: bash -c "cd /app/backend && uv run celery -A core worker -l info -c 2 -Q default"
    volumes:
      - ./backend:/app/backend
      - /app/backend/.venv
      - ./docker:/app/docker
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - piligrim_network

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: piligrim_frontend
    restart: unless-stopped
    # Host networking: Docker DNS is broken on this VPS (iptables issue).
    # Frontend needs to reach backend at 127.0.0.1:8001 for SSR.
    network_mode: "host"
    env_file:
      - .env
    environment:
      # Use 127.0.0.1 (stable IPv4 connect; `localhost` can resolve to ::1 and
      # reset). 127.0.0.1 must be in DJANGO_ALLOWED_HOSTS.
      INTERNAL_API_URL: "http://127.0.0.1:8001/api/v1"
    depends_on:
      - backend

volumes:
  postgres_data:

networks:
  piligrim_network:
    driver: bridge
